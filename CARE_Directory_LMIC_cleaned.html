const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const display=v=>v?esc(v):'—';
const regionOrder=['Africa','South America','Southeast Asia','Other Asia','India','China','Cross-regional'];
const themes=['Contact','Assured Completion','Relationship','Enabling Technologies'];
const countries=r=>r.country.split(/\s*;\s*/);
const unique=values=>[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b));
let shown=[];
function fill(id,values,all){const el=$(id),old=el.value;el.innerHTML=`<option value="">${esc(all)}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if(values.includes(old))el.value=old;}
function updateCountries(){fill('country',unique(records.filter(r=>!$('region').value||r.world_region===$('region').value).flatMap(countries)),'All countries / areas');}
function links(r){const used=new Set();return [[r.homepage,r.homepage_label||'Website'],[r.program_url,r.program_label||'Source']].filter(([url])=>{if(!/^https?:\/\/[^\s]+$/i.test(url||'')||used.has(url))return false;used.add(url);return true}).map(([url,label])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`).join('')||'—';}
function render(){const q=$('search').value.trim().toLowerCase(),region=$('region').value,country=$('country').value,type=$('type').value,theme=$('theme').value;
shown=records.filter(r=>(!region||r.world_region===region)&&(!country||countries(r).includes(country))&&(!type||r.type===type)&&(!theme||r.care_themes.includes(theme))&&(!q||[r.organization,r.country,r.world_region,r.type,r.service,r.delivery_model,r.delivery_model_detail,r.geographic_experience,r.current_practices_initiatives,r.operational_challenges,r.care_themes.join(' '),r.coverage_scale].join(' ').toLowerCase().includes(q)));
shown.sort((a,b)=>regionOrder.indexOf(a.world_region)-regionOrder.indexOf(b.world_region)||a.country.localeCompare(b.country)||a.organization.localeCompare(b.organization));
$('count').textContent=`Showing ${shown.length} of ${records.length} organizations`;
$('tbody').innerHTML=shown.length?shown.map(r=>`<tr><td><div class="org">${esc(r.organization)}</div><div class="small">${esc(r.service)}</div></td><td>${display(r.type)}<div class="small">${display(r.delivery_model)}</div></td><td>${display(r.country)}${r.geographic_experience?`<div class="small">Experience: ${esc(r.geographic_experience)}</div>`:''}</td><td class="links">${links(r)}</td><td>${r.care_themes.length?`<ul class="themes">${r.care_themes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'—'}</td><td>${display(r.current_practices_initiatives)}</td><td>${display(r.operational_challenges)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No organizations match the current filters.</td></tr>';}
function csvExport(){const cols=['organization','country','geographic_experience','world_region','type','coverage_scale','delivery_model','service','homepage','care_themes','current_practices_initiatives','operational_challenges','program_url'];const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+cols.map(cell).join(',')+'\r\n'+shown.map(r=>cols.map(k=>cell(Array.isArray(r[k])?r[k].join('; '):r[k])).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='CARE_Directory_LMIC.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
fill('region',regionOrder.filter(x=>records.some(r=>r.world_region===x)),'All geographic groups');updateCountries();fill('type',unique(records.map(r=>r.type)),'All organization types');fill('theme',themes,'All CARE themes');
$('search').addEventListener('input',render);['country','type','theme'].forEach(id=>$(id).addEventListener('change',render));$('region').addEventListener('change',()=>{updateCountries();render()});$('clear').addEventListener('click',()=>{$('search').value='';['region','country','type','theme'].forEach(id=>$(id).value='');updateCountries();render()});$('exportCsv').addEventListener('click',csvExport);render();
</script></body></html>
